services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      ZHIKE_ENV: production
      ZHIKE_DATABASE_PATH: /app/data/zhike.db
    volumes:
      - zhike_data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Competition ECS reserves 80/443/8080/8443. Nginx still listens on
      # container port 80, while the public application is exposed on 3000.
      - "3000:80"
    restart: unless-stopped

volumes:
  zhike_data:
